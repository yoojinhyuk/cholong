<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유치원 행사 역할 자동 배정기 🎈</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts (Gaegu, Noto Sans KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FFFDF9',
                        pastelYellow: '#FFF3B0',
                        pastelYellowDark: '#FFE569',
                        pastelPink: '#FFD1DC',
                        pastelPinkDark: '#FF94B8',
                        pastelMint: '#C1E7E3',
                        pastelMintDark: '#75CDB8',
                        pastelBlue: '#CBE4F9',
                        pastelPurple: '#E1CEF5',
                        warmGray: '#5C5451'
                    },
                    fontFamily: {
                        cute: ['Gaegu', 'cursive'],
                        sans: ['Noto Sans KR', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FFFDF9;
            background-image: radial-gradient(#FFD1DC 0.75px, transparent 0.75px), radial-gradient(#C1E7E3 0.75px, #FFFDF9 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            font-family: 'Noto Sans KR', sans-serif;
            color: #4A403A;
        }

        .bounce-hover:hover {
            transform: translateY(-3px);
            transition: all 0.2s ease;
        }

        /* Shuffle card transition animation */
        @keyframes flipIn {
            0% { opacity: 0; transform: rotateY(90deg) scale(0.9); }
            100% { opacity: 1; transform: rotateY(0deg) scale(1); }
        }

        .animate-flip {
            animation: flipIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FFF9F0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFD1DC;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FF94B8;
        }
    </style>
</head>
<body class="min-h-screen pb-16 pt-6 px-4">
    <!-- Top Header -->
    <header class="max-w-4xl mx-auto text-center mb-8">
        <div class="inline-block bg-white px-6 py-3 rounded-full shadow-md border-4 border-pastelYellow mb-3 bounce-hover">
            <span class="text-3xl sm:text-4xl">🌸 🎈 🧸 🎨</span>
        </div>
        <h1 class="font-cute text-4xl sm:text-5xl font-bold text-warmGray tracking-wide mb-2">
            유치원 행사 역할 자동 배정기
        </h1>
        <p class="text-sm sm:text-base text-gray-600">
            선생님과 역할을 입력하고 버튼 한 번으로 공정하게 역할을 무작위 배정해 보세요! ✨
        </p>
    </header>

    <main class="max-w-4xl mx-auto space-y-6">
        <!-- Input Grid Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- 1. Teacher List Panel -->
            <section class="bg-white/90 backdrop-blur-sm rounded-3xl p-6 shadow-lg border-2 border-pastelPink/60 flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="font-cute text-2xl font-bold flex items-center gap-2 text-warmGray">
                            <i class="fa-solid font-cute fa-users text-pastelPinkDark text-xl"></i>
                            참여 선생님 목록
                            <span id="teacherCount" class="text-xs bg-pastelPink text-gray-700 px-2 py-0.5 rounded-full">0명</span>
                        </h2>
                        <button onclick="loadTeacherPreset()" class="text-xs text-gray-600 hover:text-gray-900 underline font-medium flex items-center gap-1">
                            <i class="fa-solid fa-wand-magic-sparkles text-pastelPinkDark"></i> 예시 불러오기
                        </button>
                    </div>

                    <!-- Input form -->
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="teacherInput" placeholder="이름 입력 (쉼표로 구분 가능)"
                            class="flex-1 px-4 py-2 text-sm rounded-2xl border-2 border-pastelPink/50 focus:outline-none focus:border-pastelPinkDark transition-all"
                            onkeypress="if(event.key==='Enter') addTeachers()">
                        <button onclick="addTeachers()" 
                            class="px-4 py-2 bg-pastelPink text-warmGray font-bold rounded-2xl hover:bg-pastelPinkDark hover:text-white transition-colors text-sm shadow-sm flex items-center gap-1">
                            <i class="fa-solid fa-plus"></i> 추가
                        </button>
                    </div>

                    <!-- Teacher Tags list -->
                    <div id="teacherList" class="flex flex-wrap gap-2 min-h-[100px] max-h-[180px] overflow-y-auto p-3 bg-red-50/30 rounded-2xl border border-dashed border-pastelPink/50">
                        <span class="text-xs text-gray-400 m-auto" id="teacherEmptyMsg">선생님 이름을 추가해주세요 😊</span>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-t border-gray-100 flex justify-between items-center text-xs text-gray-500">
                    <span>* 쉼표(,)로 여러 명 동시 추가 가능</span>
                    <button onclick="clearTeachers()" class="text-red-400 hover:text-red-600 hover:underline">전체 삭제</button>
                </div>
            </section>

            <!-- 2. Role List Panel -->
            <section class="bg-white/90 backdrop-blur-sm rounded-3xl p-6 shadow-lg border-2 border-pastelMint/60 flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="font-cute text-2xl font-bold flex items-center gap-2 text-warmGray">
                            <i class="fa-solid fa-clipboard-list text-pastelMintDark text-xl"></i>
                            필요한 역할 목록
                            <span id="roleCount" class="text-xs bg-pastelMint text-gray-700 px-2 py-0.5 rounded-full">0개</span>
                        </h2>
                    </div>

                    <!-- Preset Buttons -->
                    <div class="mb-3">
                        <p class="text-xs text-gray-500 mb-1 font-medium">✨ 자주 쓰는 행사 역할 퀵 추가:</p>
                        <div class="flex flex-wrap gap-1.5">
                            <button onclick="addRolePreset('사회자')" class="px-2.5 py-1 text-xs bg-emerald-50 hover:bg-pastelMint text-emerald-800 rounded-xl border border-pastelMint transition-all">🎤 사회자</button>
                            <button onclick="addRolePreset('음향/영상')" class="px-2.5 py-1 text-xs bg-emerald-50 hover:bg-pastelMint text-emerald-800 rounded-xl border border-pastelMint transition-all">🎵 음향/영상</button>
                            <button onclick="addRolePreset('안전 요원')" class="px-2.5 py-1 text-xs bg-emerald-50 hover:bg-pastelMint text-emerald-800 rounded-xl border border-pastelMint transition-all">🛟 안전 요원</button>
                            <button onclick="addRolePreset('사진/촬영')" class="px-2.5 py-1 text-xs bg-emerald-50 hover:bg-pastelMint text-emerald-800 rounded-xl border border-pastelMint transition-all">📸 사진/촬영</button>
                            <button onclick="addRolePreset('세팅/정리')" class="px-2.5 py-1 text-xs bg-emerald-50 hover:bg-pastelMint text-emerald-800 rounded-xl border border-pastelMint transition-all">🧹 세팅/정리</button>
                            <button onclick="addRolePreset('안내/접수')" class="px-2.5 py-1 text-xs bg-emerald-50 hover:bg-pastelMint text-emerald-800 rounded-xl border border-pastelMint transition-all">📋 안내/접수</button>
                            <button onclick="addRolePreset('아이 케어')" class="px-2.5 py-1 text-xs bg-emerald-50 hover:bg-pastelMint text-emerald-800 rounded-xl border border-pastelMint transition-all">👶 아이 케어</button>
                        </div>
                    </div>

                    <!-- Input form -->
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="roleInput" placeholder="역할 입력 (쉼표로 구분 가능)"
                            class="flex-1 px-4 py-2 text-sm rounded-2xl border-2 border-pastelMint/50 focus:outline-none focus:border-pastelMintDark transition-all"
                            onkeypress="if(event.key==='Enter') addRoles()">
                        <button onclick="addRoles()" 
                            class="px-4 py-2 bg-pastelMint text-warmGray font-bold rounded-2xl hover:bg-pastelMintDark hover:text-white transition-colors text-sm shadow-sm flex items-center gap-1">
                            <i class="fa-solid fa-plus"></i> 추가
                        </button>
                    </div>

                    <!-- Role Tags list -->
                    <div id="roleList" class="flex flex-wrap gap-2 min-h-[90px] max-h-[150px] overflow-y-auto p-3 bg-teal-50/30 rounded-2xl border border-dashed border-pastelMint/50">
                        <span class="text-xs text-gray-400 m-auto" id="roleEmptyMsg">역할을 추가해 주세요 🎯</span>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-t border-gray-100 flex justify-between items-center text-xs text-gray-500">
                    <span>* 등록된 인원 수에 맞춰 1:1 배정됩니다</span>
                    <button onclick="clearRoles()" class="text-red-400 hover:text-red-600 hover:underline">전체 삭제</button>
                </div>
            </section>
        </div>

        <!-- 3. Status Alert & Action Button Bar -->
        <div class="bg-white/90 backdrop-blur-sm rounded-3xl p-5 shadow-lg border-2 border-pastelYellow flex flex-col sm:flex-row items-center justify-between gap-4">
            
            <div id="statusNotice" class="flex items-center gap-3 text-sm text-gray-700">
                <div class="w-10 h-10 rounded-2xl bg-pastelYellow flex items-center justify-center text-xl shrink-0">
                    💡
                </div>
                <div>
                    <div class="font-bold text-warmGray" id="statusTitle">준비 완료</div>
                    <div class="text-xs text-gray-500" id="statusDetail">선생님과 역할 인원수가 동일할 때 가장 깔끔하게 매칭됩니다.</div>
                </div>
            </div>

            <button onclick="assignRoles()" id="btnAssign"
                class="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-pastelYellow to-pastelYellowDark hover:from-amber-300 hover:to-amber-400 text-warmGray font-bold rounded-2xl shadow-md hover:shadow-lg transition-all transform active:scale-95 text-base flex items-center justify-center gap-2">
                <i class="fa-solid fa-dice text-xl"></i>
                <span>역할 자동 배정하기</span>
            </button>
        </div>

        <!-- 4. Result Section -->
        <section id="resultSection" class="hidden bg-white/95 backdrop-blur-md rounded-3xl p-6 sm:p-8 shadow-xl border-4 border-pastelPurple/60 transition-all">
            
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pb-6 mb-6 border-b-2 border-dashed border-pastelPurple/40">
                <div>
                    <h2 class="font-cute text-3xl font-bold text-warmGray flex items-center gap-2">
                        <span>🎁</span> 행사 역할 배정 결과
                    </h2>
                    <p class="text-xs text-gray-500 mt-1" id="resultTimestamp"></p>
                </div>

                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <!-- Re-shuffle Button -->
                    <button onclick="assignRoles()" 
                        class="flex-1 sm:flex-none px-4 py-2.5 bg-purple-50 hover:bg-pastelPurple text-purple-900 rounded-2xl font-bold text-sm transition-all border border-pastelPurple/50 flex items-center justify-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-rotate-right"></i> 다시 뽑기
                    </button>

                    <!-- Copy Result Button -->
                    <button onclick="copyResultText()" 
                        class="flex-1 sm:flex-none px-5 py-2.5 bg-pastelPurple text-purple-950 font-bold rounded-2xl hover:bg-purple-300 transition-all text-sm shadow-md flex items-center justify-center gap-2">
                        <i class="fa-solid fa-copy"></i>
                        <span>결과 텍스트 복사하기</span>
                    </button>
                </div>
            </div>

            <!-- Result Card Grid -->
            <div id="resultGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Dynamic Matching Cards Injection -->
            </div>
            
            <!-- Extra info notice if teacher/role count mismatch -->
            <div id="mismatchNotice" class="hidden mt-6 p-4 bg-amber-50 rounded-2xl border border-amber-200 text-xs text-amber-800 flex items-start gap-2">
                <i class="fa-solid fa-triangle-exclamation text-amber-500 text-sm mt-0.5"></i>
                <span id="mismatchNoticeText"></span>
            </div>
        </section>

    </main>

    <!-- Custom Toast Message -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-warmGray text-white px-6 py-3 rounded-full shadow-2xl text-sm font-medium opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-2 z-50">
        <i class="fa-solid fa-circle-check text-pastelMint"></i>
        <span id="toastMsg">클립보드에 복사되었습니다!</span>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // State Arrays
        let teachers = [];
        let roles = [];

        // Colors palette for result cards
        const cardBgColors = [
            'bg-amber-50 border-pastelYellow text-amber-950',
            'bg-rose-50 border-pastelPink text-rose-950',
            'bg-teal-50 border-pastelMint text-teal-950',
            'bg-blue-50 border-pastelBlue text-blue-950',
            'bg-purple-50 border-pastelPurple text-purple-950'
        ];

        const avatarEmojis = ['🌷', '🌼', '🐥', '🧸', '🐰', '🍒', '⭐', '🍎', '🍓', '🍀', '🦋', '🎈'];

        // --- Teacher List Management ---
        function addTeachers() {
            const input = document.getElementById('teacherInput');
            const rawVal = input.value.trim();
            if (!rawVal) return;

            const names = rawVal.split(',').map(n => n.trim()).filter(n => n.length > 0);
            names.forEach(name => {
                if (!teachers.includes(name)) {
                    teachers.push(name);
                }
            });

            input.value = '';
            renderTeachers();
            updateStatusNotice();
        }

        function removeTeacher(name) {
            teachers = teachers.filter(t => t !== name);
            renderTeachers();
            updateStatusNotice();
        }

        function clearTeachers() {
            teachers = [];
            renderTeachers();
            updateStatusNotice();
        }

        function renderTeachers() {
            const container = document.getElementById('teacherList');
            const countBadge = document.getElementById('teacherCount');
            countBadge.innerText = `${teachers.length}명`;

            if (teachers.length === 0) {
                container.innerHTML = `<span class="text-xs text-gray-400 m-auto" id="teacherEmptyMsg">선생님 이름을 추가해주세요 😊</span>`;
                return;
            }

            container.innerHTML = teachers.map((name, index) => `
                <span class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white border border-pastelPink text-warmGray rounded-2xl text-xs font-semibold shadow-sm animate-fade-in">
                    <span class="text-xs">👩‍🏫</span> ${escapeHtml(name)}
                    <button onclick="removeTeacher('${escapeHtml(name)}')" class="text-gray-400 hover:text-red-500 ml-0.5 focus:outline-none">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </span>
            `).join('');
        }

        function loadTeacherPreset() {
            const presetNames = ['보라반 선생님', '개나리반 선생님', '장미반 선생님', '사슴반 선생님', '햇살반 선생님', '달님반 선생님'];
            presetNames.forEach(name => {
                if (!teachers.includes(name)) teachers.push(name);
            });
            renderTeachers();
            updateStatusNotice();
            showToast('기본 선생님 예시 데이터가 추가되었습니다 ✨');
        }

        // --- Role List Management ---
        function addRoles() {
            const input = document.getElementById('roleInput');
            const rawVal = input.value.trim();
            if (!rawVal) return;

            const roleItems = rawVal.split(',').map(r => r.trim()).filter(r => r.length > 0);
            roleItems.forEach(role => {
                roles.push(role);
            });

            input.value = '';
            renderRoles();
            updateStatusNotice();
        }

        function addRolePreset(roleName) {
            roles.push(roleName);
            renderRoles();
            updateStatusNotice();
        }

        function removeRole(index) {
            roles.splice(index, 1);
            renderRoles();
            updateStatusNotice();
        }

        function clearRoles() {
            roles = [];
            renderRoles();
            updateStatusNotice();
        }

        function renderRoles() {
            const container = document.getElementById('roleList');
            const countBadge = document.getElementById('roleCount');
            countBadge.innerText = `${roles.length}개`;

            if (roles.length === 0) {
                container.innerHTML = `<span class="text-xs text-gray-400 m-auto" id="roleEmptyMsg">역할을 추가해 주세요 🎯</span>`;
                return;
            }

            container.innerHTML = roles.map((role, idx) => `
                <span class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white border border-pastelMint text-warmGray rounded-2xl text-xs font-semibold shadow-sm">
                    <span class="text-xs">🎯</span> ${escapeHtml(role)}
                    <button onclick="removeRole(${idx})" class="text-gray-400 hover:text-red-500 ml-0.5 focus:outline-none">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </span>
            `).join('');
        }

        // --- Status Banner Helper ---
        function updateStatusNotice() {
            const title = document.getElementById('statusTitle');
            const detail = document.getElementById('statusDetail');

            const tLen = teachers.length;
            const rLen = roles.length;

            if (tLen === 0 || rLen === 0) {
                title.innerText = '입력 대기 중';
                detail.innerText = '참여 선생님과 필요 역할 목록을 모두 등록해주세요.';
            } else if (tLen === rLen) {
                title.innerText = '완벽한 1:1 매칭 가능 🎉';
                detail.innerText = `선생님 ${tLen}명과 역할 ${rLen}개가 일치합니다.`;
            } else if (tLen > rLen) {
                title.innerText = `선생님이 ${tLen - rLen}명 더 많습니다.`;
                detail.innerText = `일부 선생님께는 '자율 도우미 / 지원' 역할이 자동 부여됩니다.`;
            } else {
                title.innerText = `역할이 ${rLen - tLen}개 더 많습니다.`;
                detail.innerText = `남은 역할은 선생님들에게 겹쳐서 고르게 추가 배정됩니다.`;
            }
        }

        // --- Fisher-Yates Shuffle Algorithm ---
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            const newArr = [...array];
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [newArr[currentIndex], newArr[randomIndex]] = [newArr[randomIndex], newArr[currentIndex]];
            }
            return newArr;
        }

        // --- Role Assignment Core Logic ---
        let lastMatches = [];

        function assignRoles() {
            if (teachers.length === 0) {
                showToast('⚠️ 선생님 이름을 먼저 추가해 주세요!');
                document.getElementById('teacherInput').focus();
                return;
            }
            if (roles.length === 0) {
                showToast('⚠️ 필요한 역할 목록을 먼저 추가해 주세요!');
                document.getElementById('roleInput').focus();
                return;
            }

            const shuffledTeachers = shuffle(teachers);
            const shuffledRoles = shuffle(roles);
            
            let matches = [];
            const tLen = shuffledTeachers.length;
            const rLen = shuffledRoles.length;

            if (tLen === rLen) {
                // Exact 1:1 match
                for (let i = 0; i < tLen; i++) {
                    matches.push({
                        teacher: shuffledTeachers[i],
                        role: shuffledRoles[i]
                    });
                }
            } else if (tLen > rLen) {
                // More teachers than roles
                for (let i = 0; i < tLen; i++) {
                    const assignedRole = i < rLen ? shuffledRoles[i] : '자율 지원 및 현장 보조 🤝';
                    matches.push({
                        teacher: shuffledTeachers[i],
                        role: assignedRole
                    });
                }
            } else {
                // More roles than teachers -> Distribute roles evenly
                for (let i = 0; i < tLen; i++) {
                    matches.push({
                        teacher: shuffledTeachers[i],
                        role: shuffledRoles[i]
                    });
                }
                // Assign leftover roles to teachers round-robin style
                for (let j = tLen; j < rLen; j++) {
                    const teacherIndex = (j - tLen) % tLen;
                    matches[teacherIndex].role += ` + ${shuffledRoles[j]}`;
                }
            }

            lastMatches = matches;
            renderResults(matches, tLen, rLen);

            // Confetti Effect
            try {
                confetti({
                    particleCount: 60,
                    spread: 70,
                    origin: { y: 0.7 }
                });
            } catch (e) {
                // Fallback if confetti script fails
            }
        }

        function renderResults(matches, tLen, rLen) {
            const resultSection = document.getElementById('resultSection');
            const resultGrid = document.getElementById('resultGrid');
            const timestamp = document.getElementById('resultTimestamp');
            const mismatchNotice = document.getElementById('mismatchNotice');
            const mismatchNoticeText = document.getElementById('mismatchNoticeText');

            resultSection.classList.remove('hidden');

            const now = new Date();
            timestamp.innerText = `배정 일시: ${now.toLocaleDateString('ko-KR')} ${now.toLocaleTimeString('ko-KR', {hour: '2-digit', minute:'2-digit'})}`;

            // Mismatch Alert text
            if (tLen !== rLen) {
                mismatchNotice.classList.remove('hidden');
                if (tLen > rLen) {
                    mismatchNoticeText.innerText = `선생님 수(${tLen}명)가 역할 수(${rLen}개)보다 많아 일부 선생님께 '자율 지원 및 현장 보조' 역할이 배치되었습니다.`;
                } else {
                    mismatchNoticeText.innerText = `역할 수(${rLen}개)가 선생님 수(${tLen}명)보다 많아 일부 선생님이 2개 이상의 역할을 함께 맡습니다.`;
                }
            } else {
                mismatchNotice.classList.add('hidden');
            }

            // Cards Render with delays for smooth animation
            resultGrid.innerHTML = matches.map((item, index) => {
                const colorStyle = cardBgColors[index % cardBgColors.length];
                const emoji = avatarEmojis[index % avatarEmojis.length];

                return `
                    <div class="animate-flip ${colorStyle} border-2 rounded-3xl p-5 shadow-sm hover:shadow-md transition-all flex items-center gap-4" style="animation-delay: ${index * 0.08}s">
                        <div class="w-12 h-12 rounded-2xl bg-white/80 border border-black/5 flex items-center justify-center text-2xl shadow-inner shrink-0">
                            ${emoji}
                        </div>
                        <div class="overflow-hidden">
                            <span class="text-xs uppercase font-bold tracking-wider text-gray-500 block mb-0.5">선생님</span>
                            <h3 class="font-bold text-lg text-gray-800 truncate">${escapeHtml(item.teacher)}</h3>
                            <div class="mt-2 pt-2 border-t border-black/10">
                                <span class="text-xs font-semibold text-gray-500 block">담당 역할</span>
                                <p class="font-cute text-xl font-bold text-gray-900 leading-tight">${escapeHtml(item.role)}</p>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Scroll down smoothly to result section
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // --- Copy to Clipboard ---
        function copyResultText() {
            if (lastMatches.length === 0) return;

            const now = new Date();
            const dateStr = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일`;

            let text = `🎈 [유치원 행사 역할 배정 결과] 🎈\n📅 배정일: ${dateStr}\n----------------------------------\n`;
            
            lastMatches.forEach((m, idx) => {
                text += `${idx + 1}. ${m.teacher} 선생님 👉 ${m.role}\n`;
            });

            text += `----------------------------------\n오늘도 아이들과 함께 행복한 하루 되세요! 🌸`;

            // Executive command fallback for iframe environments
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('📋 결과가 클립보드에 복사되었습니다!');
                } else {
                    showToast('복사에 실패했습니다. 수동으로 복사해 주세요.');
                }
            } catch (err) {
                showToast('클립보드 접근이 제한되었습니다.');
            }
            document.body.removeChild(textArea);
        }

        // --- Toast Notification ---
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');

            toastMsg.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // --- Helper: XSS Security Escape ---
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Initialize with default example data on load
        window.onload = function() {
            // Pre-fill some default roles for quick start
            roles = ['사회자', '음향/영상', '안전 요원', '사진/촬영'];
            renderRoles();
            updateStatusNotice();
        }
    </script>
</body>
</html>
